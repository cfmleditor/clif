name: Install scripts

# Runs scripts/install.sh and scripts/install.ps1 against published releases
# on each platform, when either changes: a pinned version, the version read
# from clif.version, a release from before the rename (cfmleditor-lsp
# archives, installed as clif), a version that does not exist, which must
# fail rather than install nothing quietly, a release whose checksums.txt must
# be checked, and a mirror URL that is not https, which must be refused.
on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned version
        run: |
          set -eu
          sh scripts/install.sh 0.5.0 "$RUNNER_TEMP/a"
          "$RUNNER_TEMP/a/clif" version | grep -x 'clif 0.5.0'

      - name: Version from clif.version, from before the rename
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          echo 0.4.1 > clif.version
          sh "$GITHUB_WORKSPACE/scripts/install.sh" "" "$RUNNER_TEMP/b"
          "$RUNNER_TEMP/b/clif" version | grep -x 'cfmleditor-lsp 0.4.1'

      - name: A version that does not exist fails
        run: |
          if sh scripts/install.sh 9.9.9 "$RUNNER_TEMP/c"; then
            echo "::error::installing 9.9.9 succeeded"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/c/clif"

      - name: A release from 0.5.1 on is checked against its checksums.txt
        run: |
          set -eu
          sh scripts/install.sh 0.5.3 "$RUNNER_TEMP/d" 2>"$RUNNER_TEMP/d.err"
          "$RUNNER_TEMP/d/clif" version | grep -x 'clif 0.5.3'
          if grep -q 'was not verified' "$RUNNER_TEMP/d.err"; then
            echo "::error::0.5.3 was installed without checking checksums.txt"
            exit 1
          fi

      - name: A mirror that is not https is refused
        run: |
          if CLIF_DOWNLOAD_URL=http://github.com/cfmleditor/clif/releases sh scripts/install.sh 0.5.3 "$RUNNER_TEMP/e"; then
            echo "::error::an http:// CLIF_DOWNLOAD_URL was accepted"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/e/clif"

  windows:
    name: install.ps1 (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        # PowerShell 7, and the Windows PowerShell 5.1 every Windows ships.
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned version
        run: |
          .\scripts\install.ps1 -Version 0.5.0 -Dir "$env:RUNNER_TEMP\a"
          $v = & "$env:RUNNER_TEMP\a\clif.exe" version
          if ($v -ne 'clif 0.5.0') { throw "got '$v'" }

      - name: Version from clif.version, from before the rename
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\proj" -Force | Out-Null
          Set-Location "$env:RUNNER_TEMP\proj"
          Set-Content clif.version '0.4.1'
          & "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Dir "$env:RUNNER_TEMP\b"
          $v = & "$env:RUNNER_TEMP\b\clif.exe" version
          if ($v -ne 'cfmleditor-lsp 0.4.1') { throw "got '$v'" }

      - name: A version that does not exist fails
        run: |
          $failed = $false
          try { .\scripts\install.ps1 -Version 9.9.9 -Dir "$env:RUNNER_TEMP\c" } catch { $failed = $true }
          if (-not $failed) { throw 'installing 9.9.9 succeeded' }
          if (Test-Path "$env:RUNNER_TEMP\c\clif.exe") { throw 'something was installed' }

      - name: A mirror that is not https is refused
        run: |
          $env:CLIF_DOWNLOAD_URL = 'http://github.com/cfmleditor/clif/releases'
          $failed = $false
          try { .\scripts\install.ps1 -Version 0.5.3 -Dir "$env:RUNNER_TEMP\e" } catch { $failed = $true }
          if (-not $failed) { throw 'an http:// CLIF_DOWNLOAD_URL was accepted' }
          if (Test-Path "$env:RUNNER_TEMP\e\clif.exe") { throw 'something was installed' }
