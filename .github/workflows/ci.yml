name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # setup-go's shared cache key does not distinguish ordinary, race, and
      # lint builds. Restore a job-specific snapshot of the Go build cache.
      - name: Locate the Go build cache
        id: go-build-cache
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build artifacts for this job
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # The generated CFML docs (internal/docs/generated_docs.go) are committed,
      # so nothing here needs `make docs` and its network fetches.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Release builds embed CFLint (-tags cflint_embed); compile that path
      # here too, against a stand-in archive, so a break shows before a tag.
      - name: Vet the CFLint-embedding build
        run: |
          touch internal/cflint/embedded/cflint.archive
          go vet -tags cflint_embed ./internal/cflint/ ./cmd/clif/
          go test -short -tags cflint_embed ./internal/cflint/

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # -short skips the wall-clock threshold tests (TestParsePerformance,
      # TestResolverRegexNotRecompiledPerCall). They assert microsecond budgets
      # that a shared runner cannot meet, so including them would make CI red
      # regardless of the change under test. Run the suite without -short
      # locally to measure performance.
      - name: Test
        run: go test -short ./...

      # How many times a batch scan reads its files, counted by a scanner
      # built with the passcount tag; alone, since the resolver's caches
      # outlive a test (cmd/clif/scan_passes_test.go).
      - name: Scan passes
        run: go test -tags passcount -run TestABatchScanReadsEachFileFewTimes ./cmd/clif/

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # setup-go's shared cache key does not distinguish ordinary, race, and
      # lint builds. Restore a job-specific snapshot of the Go build cache.
      - name: Locate the Go build cache
        id: go-build-cache
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build artifacts for this job
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # The server's config loading is concurrent (initialize spawns the
      # workspace index and the linter), so this is worth its own job.
      - name: Test with -race
        run: go test -short -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # setup-go's shared cache key does not distinguish ordinary, race, and
      # lint builds. Restore a job-specific snapshot of the Go build cache.
      - name: Locate the Go build cache
        id: go-build-cache
        run: echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build artifacts for this job
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-build-cache.outputs.path }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # `make lint` rather than golangci-lint-action, for the same reason the
      # vuln job below runs `make vuln`: one pinned version, shared by CI, the
      # release gate and a developer's machine, so they cannot drift apart and
      # report different findings on the same code.
      #
      # It also sidesteps a failure that has nothing to do with the code under
      # test. golangci-lint refuses to load a config whose module targets a
      # newer Go than the linter binary was itself built with, and released
      # binaries lag the Go release by weeks — so every Go bump here is a
      # coin toss on whether the published binary can start at all. The
      # Makefile builds it from source under this module's own toolchain,
      # where the mismatch cannot happen.
      #
      # What this gives up is the action's inline PR annotations: findings
      # appear in the job log rather than on the diff.
      #
      # Two caches, because a cold lint job was about 50s building the linter
      # and 90s analysing. The built linter is keyed on the Makefile and
      # go.mod, which hold the two versions its file name carries. The
      # analysis cache is saved on every run and restored from the newest
      # one: golangci-lint keys its entries by content and configuration, so
      # an older cache can only miss, never answer wrongly, and it trims
      # entries unused for five days itself. Saves from main reach every PR.
      - name: Cache the built linter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: golangci-lint-bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Cache golangci-lint's analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-lint-analysis-${{ runner.os }}-

      - name: Run golangci-lint
        run: make lint GOLANGCI_FLAGS=-v

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `make vuln` rather than an action, so this matches exactly what
      # `make release` gates on and what a developer runs locally. Like the
      # jobs above it needs no `make docs`, since generated_docs.go is
      # committed — the scan does not depend on cfdocs or docs.lucee.org
      # being reachable.
      - name: Run govulncheck
        run: make vuln

  perf:
    name: Performance (informational)
    runs-on: ubuntu-latest
    # Never gates a merge. The threshold tests assert microsecond budgets that a
    # shared runner cannot reliably meet — the CI workflow removed in May failed
    # on exactly one of them (TestResolverRegexNotRecompiledPerCall) on every
    # run, and was deleted rather than fixed. So this job publishes numbers to
    # the run summary and always exits 0; continue-on-error is belt and braces.
    # Read it by comparing runs, not by whether it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Deliberately no -short here: this is the one place the timing tests and
      # benchmarks that CI otherwise skips actually run.
      - name: Timing tests and benchmarks
        run: |
          {
            echo '## Performance'
            echo
            echo 'Advisory only — this job never fails. Thresholds are tight enough that a'
            echo 'shared runner trips them regardless of the change under test, so compare'
            echo 'these numbers against previous runs rather than reading pass/fail.'
            echo
            echo '### Threshold tests'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # -count=1 defeats the test cache: a cached "ok" would report a
          # measurement that never ran.
          go test -count=1 -run 'TestParsePerformance|TestResolverRegexNotRecompiledPerCall' \
            ./internal/parser/ ./internal/server/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          {
            echo '```'
            echo
            echo '### Benchmarks'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          go test -bench . -benchtime 100x -run '^$' ./internal/parser/ 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The built-in docs are generated from pinned and vendored sources (the cfdocs
  # commit in docs/sources.lock, docs/lucee, docs/retained), so regenerating
  # them must reproduce the committed files exactly. This catches a hand edit
  # to generated_docs.go, a regeneration committed without its sources, or a
  # pin bumped without regenerating. It fetches the pinned cfdocs commit from
  # GitHub, the only network it needs.
  docs-reproducible:
    name: Docs regenerate as committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The staged cfdocs depends only on the pinned commit, so it is cached on
      # docs/sources.lock: most runs fetch nothing, and a network blip cannot
      # fail a PR that never touched the docs (the fetch retries as well).
      - name: Cache the staged cfdocs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/src/cfdocs
            docs/.sha-cfdocs
          key: docs-cfdocs-v1-${{ hashFiles('docs/sources.lock') }}

      - name: Regenerate the docs
        run: make generate

      # `make generate` compares with HEAD, the PR's own commit: if that
      # already holds a lossy regeneration (made with DOCS_ALLOW_REMOVALS, or
      # by hand), HEAD has nothing to miss. So a pull request is also compared
      # with its base, accepting only the losses docs/allowed-removals lists,
      # a file the PR has to change, in review, to drop an entry on purpose.
      - name: Compare with the pull request's base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          # A base without the file (before #385) has nothing to compare with;
          # git failing to say (a missing object) is an error, not that.
          if ! listed=$(git ls-tree --name-only "$BASE" -- internal/docs/generated_sources.txt); then
            echo "::error::could not read the base commit $BASE"
            exit 1
          fi
          if [ -z "$listed" ]; then
            echo "The base has no generated_sources.txt yet: nothing to compare with."
            exit 0
          fi
          # The generator reads docs/allowed-removals itself, strictly: a line
          # it cannot read, "1" (which would accept every loss), or an entry
          # this PR does not actually remove (a stale one) fails the step.
          DOCS_BASELINE_REF="$BASE" DOCS_ALLOWED_REMOVALS_FILE=docs/allowed-removals go run scripts/generate_docs.go

      - name: Check nothing changed
        run: |
          # git status, not just git diff: a file make generate creates that
          # was never committed is a change too, and git diff ignores it.
          changed=$(git status --porcelain -- internal/docs docs)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- internal/docs docs | head -200
            echo "::error::make generate changed the committed docs: regenerate (make generate) and commit the result with its sources"
            exit 1
          fi
